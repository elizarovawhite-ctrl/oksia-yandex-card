<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОКСИЯ — новый дизайн, финал</title>
<style>
  :root{ --cream:#FBF5E9; --ink:#3A3226; --bronze:#8E6322; --blue:#3B5A75; --border:#E3D8BF; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#F3EDDF; color:var(--ink); font:16px/1.6 "PT Sans","Segoe UI",Arial,sans-serif; padding:28px 18px 70px; }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{ font-size:22px; color:var(--bronze); margin-bottom:6px; }
  p.lead{ color:#6B6353; margin-bottom:24px; }
  h2{ font-size:16px; color:#6B6353; margin:30px 0 10px; text-transform:uppercase; letter-spacing:.06em; }
  .card{ border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--cream);
    box-shadow:0 10px 30px rgba(90,70,30,.14); }
  .card img{ display:block; width:100%; height:auto; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:480px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  .note{ background:#FFF; border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-top:20px; }
  .note b{ color:var(--bronze); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Новый дизайн</h1>
  <p class="lead">Обложки историй и карточки товаров — в одном стиле, на согласование.</p>

  <h2>Обложки историй</h2>
  <div class="grid">
    <div class="card"><img src="cover-01.png?v=3" alt="Подготовка к школе"></div>
    <div class="card"><img src="story-sample-01-bright.png?v=9" alt="Семейные классы"></div>
    <div class="card"><img src="cover-03.png?v=2" alt="Дополнительные занятия"></div>
    <div class="card"><img src="cover-04.png?v=2" alt="Педагоги, которые выбрали РКШ"></div>
    <div class="card"><img src="cover-05.png?v=3" alt="День идёт по расписанию"></div>
    <div class="card"><img src="cover-06.png?v=2" alt="Три способа связаться"></div>
  </div>

  <h2>Карточки товаров</h2>
  <div class="grid">
    <div class="card"><img src="card-sample-01.png?v=9" alt="Начальная школа, семейные классы"></div>
    <div class="card"><img src="card-podg-4.png" alt="Подготовка к школе, 4 года"></div>
    <div class="card"><img src="card-podg-5.png" alt="Подготовка к школе, 5 лет"></div>
    <div class="card"><img src="card-podg-67.png" alt="Подготовка к школе, 6-7 лет"></div>
    <div class="card"><img src="card-kalligrafiya.png" alt="Почерк и каллиграфия"></div>
    <div class="card"><img src="card-lepka.png" alt="Лепка из глины"></div>
    <div class="card"><img src="card-chtenie.png" alt="Творческое чтение"></div>
    <div class="card"><img src="card-logoped.png" alt="Логопед"></div>
    <div class="card"><img src="card-repetitor.png" alt="Репетитор"></div>
    <div class="card"><img src="card-shahmaty.png" alt="Шахматы"></div>
  </div>

  <div class="note">
    <p><b>Шахматы:</b> в архиве не было ни одного подходящего фото с этого занятия — по твоей просьбе фото сгенерировано (Canva AI), реальных детей на нём нет.</p>
  </div>
</div>
</body>
</html>
