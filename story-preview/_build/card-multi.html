<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5E9;
    --ink:#3C280A;
    --bronze:#8A5A1B;
    --blue:#4682C8;
    --red:#D2463C;
    --green:#4F8C58;
    --blue-muted:#43678F;
    --red-muted:#A53D2D;
    --green-muted:#496E41;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1024px;height:1024px;overflow:hidden;}
  body{font-family:"PT Serif",Georgia,serif;background:var(--cream);position:relative;}

  .photo{position:absolute;top:0;left:0;width:1024px;height:610px;object-fit:cover;}

  .stripe{position:absolute;top:610px;left:0;width:1024px;height:6px;
    background:linear-gradient(90deg,
      var(--blue) 0%, var(--blue) 33.3%,
      var(--red) 33.3%, var(--red) 66.6%,
      var(--green) 66.6%, var(--green) 100%);}

  .band{position:absolute;top:616px;left:0;width:1024px;height:408px;padding:30px 56px 28px 44px;
    display:flex;flex-direction:column;}

  .kick{font-family:"PT Serif",serif;font-weight:700;font-size:23px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--bronze);}

  .title{font-family:"Playfair Display",serif;font-weight:800;font-size:58px;line-height:1.05;
    color:var(--ink);margin-top:14px;max-width:920px;}

  .row1{display:flex;align-items:center;justify-content:space-between;margin-top:22px;}

  .price{display:inline-flex;align-items:baseline;justify-content:center;gap:16px;
    background:var(--accent, var(--red-muted));
    color:var(--cream);border-radius:16px;padding:18px 30px 15px;line-height:1;
    font-family:"Playfair Display",serif;font-weight:800;font-size:40px;}
  .price .num{font-size:52px;line-height:1;}
  .price .per{font-family:"Playfair Display",serif;font-weight:700;font-style:normal;font-size:32px;
    line-height:1;color:var(--cream);}

  .logo{height:104px;width:auto;}

  .divider{margin-top:24px;height:1px;background:rgba(60,40,10,.16);width:100%;}

  .row2{display:flex;align-items:center;justify-content:space-between;margin-top:22px;}

  .phone{font-family:"Playfair Display",serif;font-weight:700;font-size:33px;color:var(--accent, var(--red-muted));}

  .btn{font-family:"Playfair Display",serif;font-weight:700;font-size:27px;color:var(--cream);
    background:var(--accent, var(--red-muted));border-radius:999px;padding:17px 38px;letter-spacing:.01em;}
</style>
</head>
<body>
  <img class="photo" id="photo" src="" alt="">
  <div class="stripe"></div>
  <div class="band">
    <div class="kick" id="kick"></div>
    <div class="title" id="title"></div>
    <div class="row1">
      <div class="price" id="price"><span class="num" id="num"></span><span class="per" id="per"></span></div>
      <img class="logo" src="oksia-logo.png" alt="Оксия">
    </div>
    <div class="divider"></div>
    <div class="row2">
      <div class="phone" id="phone">+7 (921) 556-07-24</div>
      <div class="btn">Записаться</div>
    </div>
  </div>

<script>
const S = {
1:{ photo:'photo-podg-4.jpg', kick:'Подготовка к школе', title:'4 года',
    num:'6 000', per:'в месяц', accent:'var(--blue-muted)' },
2:{ photo:'photo-podg-5.jpg', kick:'Подготовка к школе', title:'5 лет',
    num:'8 800', per:'в месяц', accent:'var(--green-muted)' },
3:{ photo:'photo-podg-67.jpg', kick:'Подготовка к школе', title:'6-7 лет',
    num:'8 800', per:'в месяц', accent:'var(--red-muted)' },
4:{ photo:'photo-kalligrafiya.jpg', kick:'Каллиграфия', title:'Почерк и каллиграфия', titleSize:'50px',
    num:'9 900', per:'курс', accent:'var(--blue-muted)' },
5:{ photo:'photo-lepka.jpg', kick:'Творческие занятия', title:'Лепка из глины',
    num:'1 100', per:'занятие', accent:'var(--green-muted)' },
6:{ photo:'photo-chtenie.jpg', kick:'Творческие занятия', title:'Творческое чтение',
    num:'1 100', per:'занятие', accent:'var(--red-muted)' },
7:{ photo:'photo-logoped.jpg', kick:'Занятия с логопедом', title:'Логопед',
    num:'2 000', per:'занятие', accent:'var(--blue-muted)' },
8:{ photo:'photo-repetitor.jpg', kick:'Помощь школьникам', title:'Репетитор',
    num:'1 600', per:'занятие', accent:'var(--green-muted)' },
9:{ photo:'photo-shahmaty.jpg', kick:'Шахматы для детей', title:'Шахматы',
    num:'1 100', per:'занятие', accent:'var(--red-muted)' },
10:{ photo:'card-photo-01.jpg', kick:'Начальная школа', title:'Семейные классы',
    num:'39 000', per:'в месяц', accent:'var(--blue-muted)' }
};

const n = parseInt(new URLSearchParams(location.search).get('n')||'1',10);
const s = S[n];
document.getElementById('photo').src = s.photo;
document.getElementById('kick').textContent = s.kick;
const titleEl = document.getElementById('title');
titleEl.textContent = s.title;
if(s.titleSize) titleEl.style.fontSize = s.titleSize;
document.getElementById('num').textContent = s.num;
document.getElementById('per').textContent = s.per;
document.getElementById('price').style.setProperty('--accent', s.accent);
document.querySelector('.phone').style.setProperty('--accent', s.accent);
document.querySelector('.btn').style.setProperty('--accent', s.accent);
</script>
</body>
</html>
