<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5E9;
    --ink:#3C280A;
    --bronze:#8A5A1B;
    --bronze-soft:#9C6B2E;
    --blue:#4682C8;
    --red:#D2463C;
    --green:#4F8C58;
    --blue-muted:#43678F;
    --red-muted:#A53D2D;
    --green-muted:#496E41;
    --chip-bg:#FBF5E9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:1920px;overflow:hidden;}
  body{
    font-family:"PT Serif",Georgia,serif;
    background:var(--cream) center/1280px 1920px no-repeat;
    color:var(--ink);
    position:relative;
  }
  .vin{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 60% at 50% 46%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%); }

  .zone{
    position:absolute; inset:0;
    padding:320px 116px 280px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  .kick{
    font-family:"PT Serif",serif; font-weight:700;
    font-size:42px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--bronze-soft);
  }
  .kick-brand{ font-size:84px; letter-spacing:.1em; }
  .kick-loc{ margin-top:18px; }

  .stripe{ margin-top:34px; width:160px; height:6px; border-radius:3px; overflow:hidden;
    display:flex; }
  .stripe i{ flex:1; display:block; }
  .stripe .b{ background:var(--blue); }
  .stripe .r{ background:var(--accent, var(--red-muted)); }
  .stripe .g{ background:var(--green); }

  .disp{
    font-family:"Playfair Display",serif; font-weight:800;
    font-size:158px; line-height:1.05; letter-spacing:-.005em;
    margin-top:40px; color:var(--accent, var(--red-muted));
  }
  .sub{ margin-top:40px; font-size:53px; font-weight:700; color:var(--bronze); }

  .chip{
    margin-top:60px;
    background:var(--chip-bg);
    border:2px solid rgba(60,40,10,.12);
    border-left:10px solid var(--accent2, var(--accent, var(--red-muted)));
    border-radius:20px;
    padding:46px 66px;
    font-size:52px; line-height:1.34; color:var(--ink);
    font-family:"Playfair Display",serif; font-style:italic; font-weight:500;
    text-align:left;
  }

  .facts{
    margin-top:56px;
    font-size:30px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ink);
  }
  .phone{
    margin-top:56px;
    font-size:53px; font-weight:700; color:var(--accent2, var(--accent, var(--red-muted)));
    font-family:"Playfair Display",serif;
  }

  .logowrap{ margin-top:70px; display:flex; align-items:center; justify-content:center; }
  .logowrap img{ height:255px; width:auto; }
</style>
</head>
<body>
  <div class="vin"></div>
  <div class="zone" id="zone"></div>

<script>
const S = {
1:{ title:'Подготовка<br>к школе', sub:'для детей 4, 5 и 6-7 лет',
    chip:'Приходит в первый класс<br>читающим и уверенным',
    bottom:{type:'facts', text:'малые группы · методика РКШ'},
    accent:'var(--green-muted)', accent2:'var(--red-muted)', bg:'bg-tb-bright.png' },

2:{ title:'Семейные<br>классы', sub:'начальная школа полного дня',
    chip:'Маленький класс, где педагог<br>видит каждого ребёнка',
    bottom:{type:'facts', text:'методика РКШ · до 12 детей в классе'},
    accent:'var(--red-muted)', bg:'bg-tb-bright.png' },

3:{ title:'Дополнительные<br>занятия', titleSize:'118px', sub:'можно ходить отдельно от школы',
    chip:'Логопед, репетитор, каллиграфия,<br>шахматы и лепка из глины',
    bottom:{type:'facts', text:'от 1 100 ₽ · для детей с 3 лет'},
    accent:'var(--green-muted)', bg:'bg-tb-bright-gold.png' },

4:{ title:'Педагоги, которые<br>выбрали РКШ', titleSize:'100px', sub:'у каждого своя специализация',
    chip:'На связи с родителями,<br>вопрос можно задать напрямую',
    bottom:{type:'facts', text:'отзывы родителей на карточке ОКСИИ'},
    accent:'var(--blue-muted)', bg:'bg-tb-bright.png' },

5:{ title:'День идёт<br>по расписанию', titleSize:'118px', sub:'класс до 12 человек',
    chip:'Перерывы, прогулка и домашние<br>задания по возрасту',
    bottom:{type:'facts', text:'короткая обратная связь родителям'},
    accent:'var(--red-muted)', bg:'bg-tb-bright-gold.png' },

6:{ title:'Три способа<br>связаться', sub:null,
    chip:'Звонок, Telegram или MAX,<br>нажмите кнопку на карточке',
    bottom:{type:'phone', text:'+7 (921) 556-07-24'},
    accent:'var(--green-muted)', bg:'bg-tb-bright.png' }
};

const n = parseInt(new URLSearchParams(location.search).get('n')||'2',10);
const s = S[n];
document.body.style.backgroundImage = `url("${s.bg}")`;
document.getElementById('zone').style.setProperty('--accent', s.accent);
document.getElementById('zone').style.setProperty('--accent2', s.accent2 || s.accent);
const z = document.getElementById('zone');
let html = `<div class="kick kick-brand">ОКСИЯ</div><div class="kick kick-loc">ВАСИЛЬЕВСКИЙ ОСТРОВ</div>`;
html += `<div class="stripe"><i class="b"></i><i class="r"></i><i class="g"></i></div>`;
html += `<h1 class="disp"${s.titleSize?` style="font-size:${s.titleSize}"`:''}>${s.title}</h1>`;
if(s.sub) html += `<div class="sub">${s.sub}</div>`;
if(s.chip) html += `<div class="chip">${s.chip}</div>`;
if(s.bottom.type==='facts') html += `<div class="facts">${s.bottom.text}</div>`;
if(s.bottom.type==='phone') html += `<div class="phone">${s.bottom.text}</div>`;
html += `<div class="logowrap"><img src="oksia-logo.png" alt="Оксия"></div>`;
z.innerHTML = html;
</script>
</body>
</html>
