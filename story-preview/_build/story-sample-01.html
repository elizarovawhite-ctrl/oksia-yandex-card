<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5E9;
    --ink:#3C280A;
    --bronze:#8A5A1B;
    --bronze-soft:#9C6B2E;
    --blue:#4682C8;
    --red:#D2463C;
    --green:#4F8C58;
    --blue-muted:#43678F;
    --red-muted:#A53D2D;
    --green-muted:#496E41;
    --chip-bg:#FBF5E9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:1920px;overflow:hidden;}
  body{
    font-family:"PT Serif",Georgia,serif;
    background:var(--cream) center/1280px 1920px no-repeat;
    background-image:url("bg-tb.png");
    color:var(--ink);
    position:relative;
  }
  .vin{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 60% at 50% 46%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%); }

  .zone{
    position:absolute; inset:0;
    padding:300px 116px 260px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  .kick{
    font-family:"PT Serif",serif; font-weight:700;
    font-size:42px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--bronze-soft);
  }

  .stripe{ margin-top:34px; width:160px; height:6px; border-radius:3px; overflow:hidden;
    display:flex; }
  .stripe i{ flex:1; display:block; }
  .stripe .b{ background:var(--blue); }
  .stripe .r{ background:var(--red); }
  .stripe .g{ background:var(--green); }

  .disp{
    font-family:"Playfair Display",serif; font-weight:800;
    font-size:158px; line-height:1.05; letter-spacing:-.005em;
    color:var(--blue-muted);
    margin-top:40px;
  }
  .sub{ margin-top:40px; font-size:53px; font-weight:700; color:var(--bronze); }

  .chip{
    margin-top:60px;
    background:var(--chip-bg);
    border:2px solid rgba(60,40,10,.12);
    border-left:10px solid var(--green);
    border-radius:20px;
    padding:46px 66px;
    font-size:52px; line-height:1.34; color:var(--ink);
    font-family:"Playfair Display",serif; font-style:italic; font-weight:500;
    text-align:left;
  }

  .facts{
    margin-top:56px;
    font-size:30px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--bronze-soft);
  }

  .logowrap{ position:absolute; left:0; right:0; bottom:56px; display:flex;
    align-items:center; justify-content:center; }
  .logowrap img{ height:172px; width:auto; }
</style>
</head>
<body>
  <div class="vin"></div>
  <div class="zone">
    <div class="kick">ОКСИЯ · ВАСИЛЬЕВСКИЙ ОСТРОВ</div>
    <div class="stripe"><i class="b"></i><i class="r"></i><i class="g"></i></div>
    <h1 class="disp">Семейные<br>классы</h1>
    <div class="sub">начальная школа полного дня</div>
    <div class="chip">Маленький класс, где педагог<br>видит каждого ребёнка</div>
    <div class="facts">методика РКШ · до 12 детей в классе</div>
  </div>
  <div class="logowrap"><img src="oksia-logo.png" alt="Оксия"></div>
</body>
</html>
